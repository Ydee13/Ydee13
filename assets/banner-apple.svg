<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Angelo Ventura De Sousa — BTS SIO SISR, MyDigitalSchool — en alternance au CCS SAM, Crédit Mutuel">
<defs>
 <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2997ff"/><stop offset=".6" stop-color="#a768ff"/><stop offset="1" stop-color="#ff5ec8"/></linearGradient>
 <linearGradient id="cardg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2b30"/><stop offset="1" stop-color="#0e0e10"/></linearGradient>
 <radialGradient id="soft" cx=".78" cy=".2" r=".6"><stop offset="0" stop-color="#2997ff" stop-opacity=".14"/><stop offset="1" stop-color="#2997ff" stop-opacity="0"/></radialGradient>
 <clipPath id="ty0"><rect x="70" y="322" height="28" width="0"><animate attributeName="width" values="0;242;242;0;0" keyTimes="0;0.0563;0.2062;0.2313;1" dur="16s" repeatCount="indefinite"/></rect></clipPath><clipPath id="ty1"><rect x="70" y="322" height="28" width="0"><animate attributeName="width" values="0;0;299;299;0;0" keyTimes="0;0.25;0.3063;0.4562;0.4813;1" dur="16s" repeatCount="indefinite"/></rect></clipPath><clipPath id="ty2"><rect x="70" y="322" height="28" width="0"><animate attributeName="width" values="0;0;290;290;0;0" keyTimes="0;0.5;0.5563;0.7063;0.7312;1" dur="16s" repeatCount="indefinite"/></rect></clipPath><clipPath id="ty3"><rect x="70" y="322" height="28" width="0"><animate attributeName="width" values="0;0;261;261;0" keyTimes="0;0.75;0.8063;0.9563;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
</defs>
<rect width="1200" height="420" rx="26" fill="#000000"/>
<rect width="1200" height="420" rx="26" fill="url(#soft)"/>
<!-- eyebrow -->
<circle cx="74" cy="74" r="4" fill="#30d158"/>
<text x="88" y="79" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#2997ff" letter-spacing="1.5">BTS SIO SISR · MYDIGITALSCHOOL</text>
<!-- nom -->
<text x="67" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="78" font-weight="600" fill="#f5f5f7" letter-spacing="-2.5" textLength="420" lengthAdjust="spacingAndGlyphs">Angelo</text>
<text x="68" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="78" font-weight="600" fill="url(#grad)" letter-spacing="-2.5" textLength="560" lengthAdjust="spacingAndGlyphs">Ventura De Sousa</text>
<!-- accroche -->
<text x="69" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#86868b">Administrateur systèmes &amp; réseaux en devenir</text>
<!-- statut animé -->
<circle cx="74" cy="336" r="3.5" fill="#2997ff"><animate attributeName="opacity" values="1;.3;1" dur="1.4s" repeatCount="indefinite"/></circle>
<g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="16" font-weight="500" fill="#f5f5f7"><text x="70" y="341" clip-path="url(#ty0)" data-i="0">étudiant en BTS SIO SISR</text><text x="70" y="341" clip-path="url(#ty1)" data-i="1">en alternance au Crédit Mutuel</text><text x="70" y="341" clip-path="url(#ty2)" data-i="2">futur admin systèmes &amp; réseau</text><text x="70" y="341" clip-path="url(#ty3)" data-i="3">passionné de cybersécurité</text></g>
<!-- carte AV -->
<g transform="translate(946 96)">
 <rect x="0" y="0" width="186" height="228" rx="30" fill="url(#cardg)" stroke="rgba(255,255,255,.12)"/>
 <text x="93" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="104" font-weight="600" fill="url(#grad)" text-anchor="middle" letter-spacing="-4">AV</text>
 <text x="93" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#f5f5f7" text-anchor="middle">BTS SIO · SISR</text>
 <text x="93" y="199" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#86868b" text-anchor="middle">2026 — 2028</text>
</g>
</svg>