<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Angelo Ventura De Sousa — BTS SIO SISR, MyDigitalSchool">
  <defs>
    <linearGradient id="grad" x1="0" x2="1">
      <stop offset="0" stop-color="#00ff88"/><stop offset="1" stop-color="#00d4ff"/>
    </linearGradient>
    <radialGradient id="glowG" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(980 90) scale(420)">
      <stop offset="0" stop-color="#00ff88" stop-opacity=".16"/><stop offset="1" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(120 420) scale(380)">
      <stop offset="0" stop-color="#00d4ff" stop-opacity=".12"/><stop offset="1" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
    <!-- machine à écrire : une découpe qui s'élargit puis se referme, pour chaque phrase -->
    <clipPath id="t1"><rect x="218" y="342" height="30" width="0"><animate attributeName="width" values="0;270;270;0;0" keyTimes="0;.09;.2;.24;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="t2"><rect x="218" y="342" height="30" width="0"><animate attributeName="width" values="0;0;220;220;0;0" keyTimes="0;.25;.33;.45;.49;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="t3"><rect x="218" y="342" height="30" width="0"><animate attributeName="width" values="0;0;170;170;0;0" keyTimes="0;.5;.57;.7;.74;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="t4"><rect x="218" y="342" height="30" width="0"><animate attributeName="width" values="0;0;285;285;0" keyTimes="0;.75;.84;.96;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- fond -->
  <rect width="1200" height="420" rx="18" fill="#0a0a0a"/>
  <rect width="1200" height="420" rx="18" fill="url(#glowG)"/>
  <rect width="1200" height="420" rx="18" fill="url(#glowC)"/>
  <rect x=".5" y=".5" width="1199" height="419" rx="18" fill="none" stroke="#ffffff" stroke-opacity=".08"/>

  <!-- navigation à points (comme le portfolio) -->
  <g font-family="'Segoe UI',Helvetica,Arial,sans-serif">
    <text x="34" y="74" font-size="22" font-weight="800" fill="#ffffff">AV<tspan fill="#00ff88">.</tspan></text>
    <circle cx="48" cy="112" r="5" fill="#00ff88"><animate attributeName="opacity" values="1;.4;1" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="48" cy="138" r="5" fill="#ffffff" fill-opacity=".14"/>
    <circle cx="48" cy="164" r="5" fill="#ffffff" fill-opacity=".14"/>
    <circle cx="48" cy="190" r="5" fill="#ffffff" fill-opacity=".14"/>
    <circle cx="48" cy="216" r="5" fill="#ffffff" fill-opacity=".14"/>
    <circle cx="48" cy="250" r="4" fill="#00ff88"><animate attributeName="r" values="4;5.5;4" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.5;1" dur="2s" repeatCount="indefinite"/></circle>
    <text x="0" y="0" transform="translate(52 270) rotate(90)" font-family="ui-monospace,Consolas,monospace" font-size="11" letter-spacing="1.5" fill="#00ff88">DISPONIBLE</text>
  </g>

  <!-- pastille -->
  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace">
    <rect x="110" y="44" width="318" height="32" rx="16" fill="#00ff88" fill-opacity=".06" stroke="#00ff88" stroke-opacity=".3"/>
    <circle cx="130" cy="60" r="3.5" fill="#00ff88"/>
    <text x="144" y="65" font-size="13" letter-spacing="1" fill="#00ff88">BTS SIO SISR • MYDIGITALSCHOOL</text>
  </g>

  <!-- nom -->
  <g font-family="'Arial Black','Segoe UI Black','Helvetica Neue',Arial,sans-serif" font-weight="900" letter-spacing="-2">
    <text x="106" y="148" font-size="72" fill="#ffffff" textLength="654" lengthAdjust="spacingAndGlyphs">ANGELO VENTURA
      <animate attributeName="opacity" values="0;1" dur=".8s" fill="freeze"/></text>
    <text x="106" y="226" font-size="72" fill="url(#grad)" textLength="372" lengthAdjust="spacingAndGlyphs">DE SOUSA<tspan fill="#00ff88">.</tspan>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;.4;1" dur="1.2s" fill="freeze"/></text>
  </g>

  <!-- accroche -->
  <text x="110" y="282" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#888888">19 ans · Admin sys en devenir · Passionné de réseaux et de cybersécurité</text>

  <!-- > status: … -->
  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="17">
    <rect x="106" y="332" width="404" height="46" rx="10" fill="#ffffff" fill-opacity=".03" stroke="#ffffff" stroke-opacity=".08"/>
    <text x="122" y="361" fill="#00ff88">&gt; status:</text>
    <text x="222" y="361" fill="#ffffff" clip-path="url(#t1)">en recherche d'alternance</text>
    <text x="222" y="361" fill="#ffffff" clip-path="url(#t2)">passionné de réseaux</text>
    <text x="222" y="361" fill="#ffffff" clip-path="url(#t3)">futur admin sys</text>
    <text x="222" y="361" fill="#ffffff" clip-path="url(#t4)">passionné de cybersécurité</text>
  </g>

  <!-- cartes flottantes -->
  <g font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#ffffff">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 0" dur="6s" repeatCount="indefinite"/>
      <rect x="870" y="58" width="150" height="54" rx="12" fill="#ffffff" fill-opacity=".03" stroke="#ffffff" stroke-opacity=".1"/>
      <g transform="translate(888 72)" fill="#00ff88"><rect width="11" height="11"/><rect x="13" width="11" height="11"/><rect y="13" width="11" height="11"/><rect x="13" y="13" width="11" height="11"/></g>
      <text x="924" y="91">Windows</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 -8;0 8;0 -8" dur="7s" repeatCount="indefinite"/>
      <rect x="990" y="150" width="140" height="54" rx="12" fill="#ffffff" fill-opacity=".03" stroke="#ffffff" stroke-opacity=".1"/>
      <text x="1008" y="183" font-family="ui-monospace,Consolas,monospace" font-size="17" fill="#00ff88">$_</text>
      <text x="1040" y="183">Linux</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 6;0 -10;0 6" dur="6.5s" repeatCount="indefinite"/>
      <rect x="830" y="236" width="160" height="54" rx="12" fill="#ffffff" fill-opacity=".03" stroke="#ffffff" stroke-opacity=".1"/>
      <g transform="translate(848 251)" fill="none" stroke="#00ff88" stroke-width="2.2"><rect x="8" width="9" height="7" rx="1"/><rect y="17" width="9" height="7" rx="1"/><rect x="16" y="17" width="9" height="7" rx="1"/><path d="M12.5 7v5M4.5 17v-5h16v5"/></g>
      <text x="886" y="269">Réseaux</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 -6;0 10;0 -6" dur="5.5s" repeatCount="indefinite"/>
      <rect x="1010" y="304" width="130" height="54" rx="12" fill="#ffffff" fill-opacity=".03" stroke="#ffffff" stroke-opacity=".1"/>
      <path transform="translate(1028 318)" d="M10 0 20 4v7c0 6-4.5 10-10 12C4.5 21 0 17 0 11V4z" fill="none" stroke="#00ff88" stroke-width="2.2"/>
      <text x="1058" y="337">Cyber</text>
    </g>
  </g>

  <!-- traînée du curseur -->
  <g fill="#00ff88">
    <circle r="3" opacity=".5"><animateMotion dur="9s" repeatCount="indefinite" path="M700 380 C 760 300, 700 200, 800 140 S 760 40, 700 60"/></circle>
    <circle r="2.2" opacity=".3"><animateMotion dur="9s" begin="-.12s" repeatCount="indefinite" path="M700 380 C 760 300, 700 200, 800 140 S 760 40, 700 60"/></circle>
    <circle r="1.5" opacity=".18"><animateMotion dur="9s" begin="-.24s" repeatCount="indefinite" path="M700 380 C 760 300, 700 200, 800 140 S 760 40, 700 60"/></circle>
    <circle r="16" fill="none" stroke="#00ff88" stroke-opacity=".6"><animateMotion dur="9s" begin="-.5s" repeatCount="indefinite" path="M700 380 C 760 300, 700 200, 800 140 S 760 40, 700 60"/></circle>
  </g>

  <!-- ligne de défilement -->
  <rect x="1150" y="140" width="1.5" height="44" fill="url(#grad)">
    <animate attributeName="height" values="0;44;0" dur="2s" repeatCount="indefinite"/>
  </rect>
</svg>
