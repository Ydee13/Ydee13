<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Angelo Ventura De Sousa — BTS SIO option SISR">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18"/><stop offset="1" stop-color="#0d1430"/>
    </linearGradient>
    <linearGradient id="spectrum" x1="0" x2="1">
      <stop offset="0" stop-color="#ffb020"/><stop offset=".33" stop-color="#ff4f8b"/><stop offset=".66" stop-color="#5b8cff"/><stop offset="1" stop-color="#3ee6a0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#a0b4ff" stroke-opacity=".07"/>
    </pattern>
    <clipPath id="type2"><rect x="56" y="210" height="30" width="0"><animate attributeName="width" values="0;0;520;520" keyTimes="0;.12;.36;1" dur="9s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <rect width="1200" height="340" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="14" fill="url(#grid)"/>
  <rect x=".5" y=".5" width="1199" height="339" rx="14" fill="none" stroke="#a0b4ff" stroke-opacity=".18"/>

  <!-- barre de fenêtre -->
  <circle cx="30" cy="26" r="6" fill="#ff5f57"/><circle cx="50" cy="26" r="6" fill="#febc2e"/><circle cx="70" cy="26" r="6" fill="#28c840"/>
  <text x="96" y="31" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#7f89a8">angelo@bts-sio: ~</text>
  <line x1="0" y1="50" x2="1200" y2="50" stroke="#a0b4ff" stroke-opacity=".12"/>

  <!-- nom -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1" keyTimes="0;.08;1" dur="9s" repeatCount="indefinite"/>
    <text x="54" y="140" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-weight="800" font-size="52" fill="#e9ecf5" letter-spacing="-1">Angelo</text>
    <text x="246" y="140" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-weight="800" font-size="52" fill="none" stroke="#ffb020" stroke-width="1.4" letter-spacing="-1">Ventura De Sousa</text>
    <text x="56" y="178" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="20" fill="#99a3c0">Étudiant en <tspan fill="#e9ecf5" font-weight="700">BTS SIO option SISR</tspan> · MyDigitalSchool</text>
  </g>

  <!-- commande 2 -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18">
    <text x="56" y="232" clip-path="url(#type2)"><tspan fill="#99a3c0">systèmes · réseaux · support · cybersécurité</tspan></text>
  </g>
  <rect x="56" y="262" width="10" height="20" fill="#ffb020">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
  <rect x="56" y="318" width="420" height="3" rx="1.5" fill="url(#spectrum)" opacity=".85"/>

  <!-- pile OSI -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13">
    <text x="1040" y="84" text-anchor="middle" fill="#7f89a8" letter-spacing="2">MODÈLE OSI</text>
    <g>
      <rect x="930" y="104" width="220" height="30" rx="4" fill="#3ee6a0" fill-opacity=".14" stroke="#3ee6a0"><animate attributeName="fill-opacity" values=".14;.55;.14" dur="4.2s" begin="0.00s" repeatCount="indefinite"/></rect>
      <text x="946" y="124" fill="#e9ecf5">7  Application</text>
      <rect x="930" y="144" width="220" height="30" rx="4" fill="#2fd6e6" fill-opacity=".14" stroke="#2fd6e6"><animate attributeName="fill-opacity" values=".14;.55;.14" dur="4.2s" begin="0.45s" repeatCount="indefinite"/></rect>
      <text x="946" y="164" fill="#e9ecf5">6  Présentation</text>
      <rect x="930" y="184" width="220" height="30" rx="4" fill="#ff4f8b" fill-opacity=".14" stroke="#ff4f8b"><animate attributeName="fill-opacity" values=".14;.55;.14" dur="4.2s" begin="0.90s" repeatCount="indefinite"/></rect>
      <text x="946" y="204" fill="#e9ecf5">3  Réseau</text>
      <rect x="930" y="224" width="220" height="30" rx="4" fill="#ff7a3d" fill-opacity=".14" stroke="#ff7a3d"><animate attributeName="fill-opacity" values=".14;.55;.14" dur="4.2s" begin="1.35s" repeatCount="indefinite"/></rect>
      <text x="946" y="244" fill="#e9ecf5">2  Liaison</text>
      <rect x="930" y="264" width="220" height="30" rx="4" fill="#ffb020" fill-opacity=".14" stroke="#ffb020"><animate attributeName="fill-opacity" values=".14;.55;.14" dur="4.2s" begin="1.80s" repeatCount="indefinite"/></rect>
      <text x="946" y="284" fill="#e9ecf5">1  Physique</text>
    </g>
    <!-- paquet qui descend la pile -->
    <circle cx="912" cy="113" r="5" fill="#ffb020">
      <animate attributeName="cy" values="119;279;279" keyTimes="0;.85;1" dur="4.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <line x1="912" y1="104" x2="912" y2="294" stroke="#a0b4ff" stroke-opacity=".2" stroke-dasharray="3 5"/>
  </g>
</svg>
